<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141412">
<title>Al Rehman Food &amp; Restaurant - Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141412;--sf:#1f1e1b;--ln:#33312c;--gd:#d6a84e;--tx:#f1ece1;--mt:#9a9486}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "DM Sans",system-ui,sans-serif;padding-bottom:90px}
header{text-align:center;padding:calc(20px + env(safe-area-inset-top)) 16px 12px}
h1{font:600 27px "Cormorant Garamond",Georgia,serif;color:var(--gd)}
header p{color:var(--mt);font-size:13px;margin-top:2px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln)}
#q{display:block;width:calc(100% - 24px);margin:10px 12px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);font:inherit;font-size:14px}
#q:focus{outline:2px solid var(--gd)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--ln);background:none;color:var(--mt);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--gd);border-color:var(--gd);color:#141412;font-weight:500}
section{scroll-margin-top:118px;padding:18px 12px 4px;max-width:640px;margin:0 auto}
h2{font:600 22px "Cormorant Garamond",Georgia,serif;color:var(--gd);margin-bottom:6px}
.it{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--ln)}
.th{position:relative;flex:none;width:64px;height:64px;border-radius:10px;background:var(--sf);display:grid;place-items:center;font-size:27px;overflow:hidden}
.th.w{width:88px}
.it[hidden],section[hidden]{display:none}
#nf{text-align:center;color:var(--mt);padding:40px 16px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bd{flex:1;min-width:0}
.nm{font-weight:500}
.ds{color:var(--mt);font-size:12.5px;margin-top:2px}
.v{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
.v span{color:var(--gd);font-size:14px}
.v i{font-style:normal;color:var(--mt);margin-right:7px}
.s{display:inline-flex;align-items:center;gap:8px}
.s button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gd);background:none;color:var(--gd);font-size:19px;line-height:1;cursor:pointer}
.s button.p{background:var(--gd);color:#141412}
.s u{text-decoration:none;min-width:16px;text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 40%)}
#bar[hidden]{display:none}
#ob{width:100%;max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--gd);color:#141412;border:0;border-radius:12px;padding:13px 16px;font:500 15px "DM Sans",system-ui,sans-serif;cursor:pointer}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sh.on{display:flex}
#pn{background:var(--sf);width:100%;max-width:640px;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#pn h3{font:600 22px "Cormorant Garamond",Georgia,serif;color:var(--gd);margin-bottom:4px}
.ln{display:grid;grid-template-columns:1fr auto 62px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}
.ln b{text-align:right;font-weight:500}
.tt{display:flex;justify-content:space-between;padding:7px 0;color:var(--mt)}
.tt.g{color:var(--gd);font-size:18px;font-weight:500;border-top:1px solid var(--gd);margin-top:4px;padding-top:10px}
.ac{display:flex;gap:10px;margin-top:12px}
.ac button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--gd);background:none;color:var(--gd);font:500 14px "DM Sans",system-ui,sans-serif;cursor:pointer}
.ac button.p{background:var(--gd);color:#141412}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
</style>
</head>
